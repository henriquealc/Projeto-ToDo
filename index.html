<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTask - Simples. Rápido. EasyTask.</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media-query.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!--link para carregar os simbolos-->
</head>
<body>
    <main>
        <h1 class="task">EasyTask</h1>
        <p class="slogan">Sua lista de tarefas simples e eficiente</p>
        <form id="formToDo">
            <input type="hidden" id="index"> <!--usado para quando for editar um tarefa existente, hidden faz o usuario não ver o campo na tela-->
            <div class="campo">
            <input type="text" id="tituloTarefa" placeholder=" Título da Tarefa" required>
            </div>

            <div class="campo">
            <textarea type="text" id="descricao" cols="20" rows="5" maxlength="100" placeholder=" Descrição da Tarefa..." required></textarea>
            </div>
            
            <input type="date" title="Data" id="data" required>
            
            <select id="prioridade" required>
                <option value="" disabled selected>Prioridade</option>            
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
            </select>
            <button type="submit" title="Salvar"><i class="fa-solid fa-plus"></i></button>
        </form>

        <div class="buscar-tarefa">
        <input type="text" id="buscar" placeholder=" Buscar Tarefa...">
        <button onclick="buscarTarefa()" title="Buscar Tarefa"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button onclick="listarTarefas()" title="Listar Tarefas"><i class="fa-solid fa-list"></i></button>
        </div>

        <p id="mensagem"></p>
        <div class="responsive-table">
            <table class="tabela">
                <thead id="cabecalhoTabela">
                    <tr>
                        <th>Título</th>
                        <th>Descrição</th>
                        <th>Prioridade</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaTarefas"></tbody>
            </table>
        </div>
    </main>
    <footer><p>Desenvolvido por <a href="https://www.linkedin.com/in/henriquealc/" target="_blank">Henrique Alcântara</a> | RU: 5209545</p></footer>
    <script src="js/script.js"></script>
</body>
</html>
